[package]
name = "fnos-desktop"
version = "0.1.0"
description = "自研 fnOS 桌面客户端（Windows 11，自用版）"
authors = ["jonas-yu"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
